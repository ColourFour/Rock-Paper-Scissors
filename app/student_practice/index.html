<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Question Practice</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="practice-shell">
      <section class="toolbar" aria-label="Practice controls">
        <div>
          <label for="paperSelect">Paper</label>
          <select id="paperSelect"></select>
        </div>
        <div>
          <label for="topicSelect">Topic</label>
          <select id="topicSelect"></select>
        </div>
        <button id="nextQuestion" type="button">Give me a question</button>
        <label class="file-loader">
          Load JSON
          <input id="jsonFile" type="file" accept="application/json">
        </label>
      </section>

      <p id="status" class="status" role="status">Loading question bank...</p>

      <section id="questionArea" class="question-area" hidden>
        <div class="meta-line">
          <span id="paperName"></span>
          <span id="topicName"></span>
          <span id="questionNumber"></span>
          <span id="marks"></span>
        </div>

        <img id="questionImage" class="exam-image" alt="Question">

        <div class="answer-controls">
          <button id="checkAnswer" type="button">Check answer</button>
        </div>

        <section id="answerArea" class="answer-area" hidden>
          <h2>Mark scheme</h2>
          <img id="markschemeImage" class="exam-image" alt="Mark scheme answer">
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
