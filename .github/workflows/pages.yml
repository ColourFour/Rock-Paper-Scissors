name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proof-court-source/package-lock.json

      - name: Install proof court dependencies
        working-directory: proof-court-source
        run: npm ci

      - name: Test proof court logic
        working-directory: proof-court-source
        run: npm test

      - name: Check proof court source
        working-directory: proof-court-source
        run: npm run lint

      - name: Build proof court
        working-directory: proof-court-source
        run: npm run build:edgeone

      - name: Build static site artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          if [ -d assets ]; then
            cp -R assets _site/assets
          fi
          for page_dir in p1 p3 p4 p5 data; do
            if [ -d "$page_dir" ]; then
              cp -R "$page_dir" _site/
            fi
          done
          cp -R proof-court-source/dist-edgeone _site/proof-court
          if [ -f REBUILD_NOTES.md ]; then
            cp REBUILD_NOTES.md _site/REBUILD_NOTES.md
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
